name: Bug report
description: 报告配置读取、诊断、握手或界面问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 API Key、令牌和完整配置中的敏感内容。
        安全问题请使用 Security 页面的私密报告，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行 `python -m mcpmanager --version` 或查看窗口标题
      placeholder: 1.1.1
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Trae
        - Antigravity
        - Codex
        - OpenCode
        - Copilot / VS Code
        - Claude / Cursor / 其他
        - 与特定 Agent 无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附上报错文本或脱敏后的截图
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: 可粘贴 `mcpmanager doctor --agent <id> --env` 和 `mcpmanager probe --agent <id> --json` 的脱敏输出
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已确认内容中不含 API Key、令牌或私人路径
          required: true
        - label: 已搜索现有 Issue，未发现重复
          required: true
