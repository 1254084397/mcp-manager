name: Feature request
description: 建议新的 Agent、诊断能力或工作流改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体不便，而不是只给一个功能名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果涉及新 Agent，请给出配置路径、格式和示例字段
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - Agent profile / 配置读取
        - 扫描与来源分级
        - 诊断与握手
        - 版本与更新
        - 图形界面
        - 文档与发布
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未发现重复
          required: true
        - label: 该建议不依赖执行不可信命令或绕过备份流程
          required: true
