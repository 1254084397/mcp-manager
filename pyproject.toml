[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-manager"
version = "1.1.0"
description = "Agent-agnostic MCP configuration manager: scan, sync, diagnose and upgrade MCP servers across AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcp-manager contributors" }]

[project.scripts]
mcpmanager = "mcpmanager.cli:main"

[tool.setuptools]
packages = ["mcpmanager"]

[tool.setuptools.package-data]
mcpmanager = ["agents/*.toml", "catalog/*.json"]
